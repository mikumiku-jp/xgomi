name: その他（提案・不具合・質問）
description: カテゴリの追加提案、不具合の報告、ポリシーへの意見、使い方の質問
labels: ["misc"]
body:
  - type: markdown
    attributes:
      value: |
        個別アカウントの掲載・掲載解除は、専用のテンプレートを使ってください。

  - type: dropdown
    id: kind
    attributes:
      label: 種別
      options:
        - カテゴリの追加・変更の提案
        - 不具合の報告
        - ポリシー・運用への意見
        - 使い方の質問
        - その他
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 内容
      description: |
        **カテゴリの提案**なら、次の3点を書いてください。POLICY.md にそのまま定義を追記できる形だと話が早いです。
        - どういう行為か（1行の定義）
        - 既存のカテゴリでは何が足りないのか
        - 「これは含まない」の線引き（正当な活動を巻き込まないために必要です）

        **不具合の報告**なら、何をしたら何が起きたか、期待した挙動は何かを書いてください。
      placeholder: |
        例（カテゴリの提案）:
        定義: 自動生成したリプライで他人の投稿に無差別にぶら下がっている
        既存カテゴリとの違い: engagement-farming は定型リプライだが、こちらは本文をAIに書かせている点が違う
        含まないもの: 手動で書いた短いリプライ、Botであることを明示しているアカウント
    validations:
      required: true

  - type: input
    id: refs
    attributes:
      label: 参考URL
      description: 関連する Issue / PR / 投稿など。あれば。
    validations:
      required: false
