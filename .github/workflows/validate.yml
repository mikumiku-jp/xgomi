name: validate

on:
  # 自己テストは README や POLICY のカテゴリ表も検査するので、絞り込まない。
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: 変更されたエントリを検出
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- 'accounts/*.json' | tr '\n' ' ')
          echo "変更されたエントリ: ${files:-なし}"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      # 比較はドット3つ（分岐点との差分）で行う。ドット2つだと単純比較になり、
      # PRが開いている間に main が進んだだけで「向こうにあってこちらにない」変更が
      # 差分として出る。dist/ はボットが何度も更新するので、報告者が触っていなくても
      # 「dist/ を手で編集しないでください」で落ちる。
      - name: dist/ の手編集を拒否
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -q '^dist/'; then
            echo "::error::dist/ は accounts/ から自動生成されます。手で編集しないでください。"
            exit 1
          fi

      - name: 自己テスト
        run: node scripts/selftest.mjs

      - name: 形式チェック（全件）
        run: node scripts/validate.mjs

      - name: 証拠ツイートの投稿者照合（変更分のみ）
        if: steps.changed.outputs.files != ''
        run: node scripts/validate.mjs --network ${{ steps.changed.outputs.files }}

      - name: dist/ が再生成可能か確認
        run: |
          set -euo pipefail
          node scripts/build.mjs
          if ! git diff --quiet -- dist/; then
            echo "::notice::dist/ は main へのマージ後に自動更新されます。"
          fi
