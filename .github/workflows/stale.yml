name: stale

# 自動検証に失敗したまま放置された報告 Issue を畳む。
# 検証を通った報告は PR の `Closes #N` でマージ時に閉じるので、ここには残らない。

on:
  schedule:
    - cron: "17 3 * * 1" # 毎週月曜
  workflow_dispatch:

permissions:
  issues: write

jobs:
  close-stale:
    runs-on: ubuntu-latest
    steps:
      - name: 30日動きのない報告 Issue を閉じる
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '30 days ago' +%Y-%m-%d)"

          # PR が既に紐づいている Issue は対象外（レビュー待ちの可能性がある）
          gh issue list --repo "$REPO" --state open --label report \
            --search "updated:<${cutoff}" --limit 100 \
            --json number,title --jq '.[] | .number' > stale.txt || true

          if [ ! -s stale.txt ]; then
            echo "対象はありませんでした。"
            exit 0
          fi

          while read -r n; do
            [ -n "$n" ] || continue
            if gh pr list --repo "$REPO" --search "linked:issue-${n}" --json number \
                 --jq 'length' 2>/dev/null | grep -qv '^0$'; then
              echo "#${n}: PR があるためスキップ"
              continue
            fi
            gh issue comment "$n" --repo "$REPO" --body \
              "30日間動きがないため、いったん閉じます。自動検証に失敗したままの場合は、指摘された点を直して新しく報告してください。"
            gh issue close "$n" --repo "$REPO" --reason "not planned"
            echo "#${n}: 閉じました"
          done < stale.txt
