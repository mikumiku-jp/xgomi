name: issue-to-pr

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: issue-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  convert:
    # 自分でタイトルを書き換えた分の edited イベントで再実行しないよう、
    # ボット起因の編集は無視する
    if: >-
      contains(github.event.issue.labels.*.name, 'report') &&
      github.event.sender.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Issue を JSON に変換して検証
        id: convert
        env:
          # 環境変数経由で渡すことでシェルインジェクションを防ぐ
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if node scripts/issue-to-json.mjs > convert.log 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          cat convert.log

      - name: Issue のタイトルを付ける
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          OK: ${{ steps.convert.outputs.ok }}
          LABEL: ${{ steps.convert.outputs.label }}
          ISSUE_LABEL: ${{ steps.convert.outputs.issue_title }}
        run: |
          set -euo pipefail
          # 失敗した報告も一覧で見分けられるように、分かっている分だけ出す
          if [ "$OK" = "true" ]; then
            want="[report] ${ISSUE_LABEL}"
          elif [ -n "$LABEL" ]; then
            want="[report] ${LABEL}（検証エラー）"
          else
            want="[report] （検証エラー）"
          fi
          if [ "$ISSUE_TITLE" != "$want" ]; then
            gh issue edit "$ISSUE_NUMBER" --title "$want"
          fi

      - name: 失敗理由を Issue にコメント
        if: steps.convert.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "## ⚠ 自動検証に失敗しました"
            echo
            echo '```'
            cat convert.log
            echo '```'
            echo
            echo "Issue 本文を編集すると自動で再検証されます。"
            echo "証拠ツイートが削除済みの場合は、魚拓URLを添えて手動でPRを送ってください（[CONTRIBUTING.md](../blob/main/CONTRIBUTING.md)）。"
          } > comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file comment.md
          exit 1

      - name: PR を作成 / 更新
        if: steps.convert.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          COUNT: ${{ steps.convert.outputs.count }}
          FILES: ${{ steps.convert.outputs.files }}
          SUBJECT: ${{ steps.convert.outputs.subject }}
          ROWS: ${{ steps.convert.outputs.rows }}
        run: |
          set -euo pipefail
          branch="report/issue-${ISSUE_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # accounts/<数字>.json の形しか入らないので、分割させて渡す
          # shellcheck disable=SC2086
          git add -- $FILES

          if git diff --cached --quiet; then
            gh issue comment "$ISSUE_NUMBER" \
              --body "既存データに変更はありませんでした。報告された内容はすべて掲載済みです。"
            exit 0
          fi

          git commit -m "$SUBJECT" -m "Closes #${ISSUE_NUMBER}"
          git push --force origin "$branch"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh issue comment "$ISSUE_NUMBER" --body "PR を更新しました。"
            exit 0
          fi

          {
            echo "Closes #${ISSUE_NUMBER}"
            echo
            echo "報告者 @${ISSUE_USER} / ${COUNT} 件"
            echo
            echo "| username | 数値ID | 証拠件数 | 種別 |"
            echo "|---|---|---|---|"
            echo "$ROWS"
            echo
            echo "### 確認済み"
            echo
            echo "- ✅ 証拠ツイートはすべて対象アカウント本人の投稿"
            echo "- ✅ 記載内容の形式に問題なし"
            echo
            echo "### レビュー時の確認事項"
            echo
            echo "- [ ] カテゴリが [POLICY.md](../blob/main/POLICY.md) の定義に実際に該当するか"
            echo "- [ ] 単発の言い間違いや勘違いを咎めるものになっていないか"
            echo "- [ ] 私怨や意見の不一致による報告ではないか"
            echo "- [ ] 個人情報や人格攻撃が含まれていないか"
            if [ "$COUNT" -gt 1 ]; then
              echo
              echo "一部だけ見送る場合は、このブランチで該当の JSON を削除して push してください。"
            fi
          } > pr-body.md

          gh pr create \
            --base main \
            --head "$branch" \
            --title "$SUBJECT" \
            --body-file pr-body.md \
            --label report

          gh issue comment "$ISSUE_NUMBER" --body "検証を通過し、PR を作成しました。メンテナのレビューをお待ちください。"
