name: 掲載解除をリクエストする
description: 誤った掲載の訂正や削除を申請します（本人でも第三者でも可）
# 対象を特定したあとで自動的に付け直すので、入力させない
title: "[removal] "
labels: ["removal"]
body:
  - type: markdown
    attributes:
      value: |
        誤りがあれば掲載を解除します。
        証拠を伴わない掲載や人違いは、このリストにとっても害になります。

        該当する投稿を削除し、同様の投稿を続けていない場合も掲載解除の対象です。
        やり直しを妨げることは目的ではありません。

        タイトルは自動で付くので、そのまま送信してかまいません。

  - type: input
    id: account
    attributes:
      label: 対象アカウント
      description: "`@handle`、プロフィールURL、または `accounts/` 内の数値ID"
      placeholder: "@example  /  1234567890"
    validations:
      required: true

  - type: dropdown
    id: reason
    attributes:
      label: 申請理由
      options:
        - 人違いやIDの取り違え
        - 証拠ツイートが本人のものではない
        - カテゴリの定義に該当しない
        - 該当投稿を削除し、現在は続けていない
        - 掲載内容に個人情報や人格攻撃が含まれている
        - その他
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 詳細
      description: |
        なぜ掲載が誤りなのかを説明してください。
        反証となる資料（投稿URLなど）があれば添えてください。
    validations:
      required: true

  - type: dropdown
    id: relationship
    attributes:
      label: 申請者の立場
      options:
        - 掲載された本人
        - 第三者
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > 本人確認は求めません。
        > 申請してきた人が誰かではなく、申請の内容そのものを検証して判断します。
        > 身元を示す情報をこのIssueに書かないでください。
