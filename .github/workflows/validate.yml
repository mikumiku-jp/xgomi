name: validate

on:
  pull_request:
    paths:
      - "accounts/**"
      - "scripts/**"
      - "schema/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: 変更されたエントリを検出
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- 'accounts/*.json' | tr '\n' ' ')
          echo "変更されたエントリ: ${files:-なし}"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: dist/ の手編集を拒否
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^dist/'; then
            echo "::error::dist/ は accounts/ から自動生成されます。手で編集しないでください。"
            exit 1
          fi

      - name: 形式チェック（全件）
        run: node scripts/validate.mjs

      - name: 証拠ツイートの投稿者照合（変更分のみ）
        if: steps.changed.outputs.files != ''
        run: node scripts/validate.mjs --network ${{ steps.changed.outputs.files }}

      - name: dist/ が再生成可能か確認
        run: |
          set -euo pipefail
          node scripts/build.mjs
          if ! git diff --quiet -- dist/; then
            echo "::notice::dist/ は main へのマージ後に自動更新されます。"
          fi
